{% extends "base.html" %}
{% block content %}
<section class="hero-card"><h1>{{ title }}</h1></section>
<form class="card" method="post" action="{{ action }}">
  <label>Name<input name="name" value="{{ variant.name if variant else '' }}" {% if is_builtin %}readonly{% endif %}></label>
  <label>Description<textarea name="description" {% if is_builtin %}readonly{% endif %}>{{ variant.description if variant else '' }}</textarea></label>
  <label>Resume Tailoring Prompt<textarea name="resume_tailoring" {% if is_builtin %}readonly{% endif %}>{{ prompts.resume_tailoring }}</textarea></label>
  <label>Cover Letter Prompt<textarea name="cover_letter" {% if is_builtin %}readonly{% endif %}>{{ prompts.cover_letter }}</textarea></label>
  <label>Fit Analysis Prompt<textarea name="fit_analysis" {% if is_builtin %}readonly{% endif %}>{{ prompts.fit_analysis }}</textarea></label>
  {% if not is_builtin %}<button type="submit">Save Prompt Variant</button>{% else %}<p class="muted">Built-in Prompt Variant is read-only. Use Copy to create a custom variant.</p>{% endif %}
</form>
{% endblock %}
