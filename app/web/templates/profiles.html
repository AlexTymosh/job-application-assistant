{% extends "base.html" %}{% block content %}<div class="actions"><h1>Person profiles</h1><a class="button" href="/profiles/new">Create profile</a></div><div class="grid">{% for profile in profiles %}<section class="card"><h2>{{ profile.display_name }}</h2><p>{{ profile.full_name }}</p><p class="muted">Private profile data stays local.</p><div class="actions"><a class="button" href="/profiles/{{ profile.id }}">Open</a><a class="button secondary" href="/profiles/{{ profile.id }}/resumes">Resumes</a><a class="button secondary" href="/profiles/{{ profile.id }}/facts">Facts</a><a class="button danger" href="/profiles/{{ profile.id }}#delete-profile">Delete profile</a></div></section>{% else %}<section class="card"><p>No person profiles yet.</p></section>{% endfor %}</div>{% endblock %}
