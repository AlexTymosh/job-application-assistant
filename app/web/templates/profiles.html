{% extends "base.html" %}
{% block content %}
<section class="hero-card"><h1>Person profiles</h1><a class="button" href="/profiles/new">Create profile</a></section>
<div class="grid">{% for profile in profiles %}<section class="card"><h2>{{ profile.display_name }}</h2><p>{{ profile.full_name }}</p><p class="muted">{{ profile.location }}</p><div class="actions"><a class="button" href="/profiles/{{ profile.id }}">Open</a><a class="button secondary" href="/profiles/{{ profile.id }}/resumes">Resume Variants</a><a class="button secondary" href="/profiles/{{ profile.id }}/master-cv">Master CV</a></div></section>{% else %}<section class="card"><p>No person profiles yet.</p></section>{% endfor %}</div>
{% endblock %}
