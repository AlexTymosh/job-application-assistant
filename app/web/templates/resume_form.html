{% extends "base.html" %}
{% block content %}
<section class="card"><h1>{% if resume is defined and resume %}Edit Resume Variant{% else %}New Resume Variant{% endif %}</h1><form method="post"><label>Name<input name="name" value="{{ resume.name if resume is defined and resume else '' }}" required></label><label>Target role<input name="target_role" value="{{ resume.target_role if resume is defined and resume else '' }}"></label><label>Language<input name="language" value="{{ resume.language if resume is defined and resume else 'en' }}"></label>{% if not (resume is defined and resume) %}<label class="checkbox-line"><input type="checkbox" name="is_default"> Make default variant</label>{% endif %}<button type="submit">Save Resume Variant</button></form></section>
{% endblock %}
