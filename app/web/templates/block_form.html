{% extends "base.html" %}{% block content %}<h1>{{ 'Edit block' if block else 'Add block' }}</h1><form method="post"><label>Section<select name="section_id">{% for section in resume.sections %}<option value="{{ section.id }}" {% if block and block.section_id == section.id %}selected{% endif %}>{{ section.title }}</option>{% endfor %}</select></label><label>Block type<select name="block_type">{% for type in block_types %}<option value="{{ type }}" {% if block and block.block_type == type %}selected{% endif %}>{{ type }}</option>{% endfor %}</select></label><label>Title<input name="title" value="{{ block.title if block else '' }}"></label><label>Role title<input name="role_title" value="{{ block.role_title if block else '' }}"></label><label>Organisation<input name="organisation" value="{{ block.organisation if block else '' }}"></label><label>Content<textarea name="content">{{ block.content if block else '' }}</textarea></label><label><input type="checkbox" name="ai_edit_enabled" value="true" {% if block and block.ai_edit_enabled %}checked{% endif %}> AI may edit this block</label><button>Save block</button></form>{% endblock %}
