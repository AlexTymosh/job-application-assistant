<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "AI JOB APPLICATION ASSISTANT by Alex Tymoshenko" }}</title>
  <style>
    :root { --bg:#f7f9fc; --panel:#fff; --text:#172033; --muted:#64748b; --brand:#2563eb; --brand-dark:#1d4ed8; --line:#e2e8f0; --good:#15803d; --warn:#b45309; --bad:#b91c1c; --shadow:0 8px 24px rgba(15,23,42,.06); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
    a { color:var(--brand); }
    .shell-header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; justify-content:space-between; padding:.65rem 1rem; background:#fff; color:var(--text); border-bottom:1px solid var(--line); box-shadow:0 4px 14px rgba(15,23,42,.05); }
    .brand { display:flex; align-items:center; gap:.55rem; font-weight:750; letter-spacing:.01em; }
    .brand small { display:block; font-weight:400; color:var(--muted); letter-spacing:0; }
    .brand-icon { display:grid; place-items:center; width:2rem; height:2rem; border-radius:.65rem; background:#dbeafe; color:#1d4ed8; }
    nav { display:flex; gap:.25rem; align-items:center; }
    nav a { color:#334155; text-decoration:none; font-weight:650; padding:.42rem .62rem; border-radius:999px; }
    nav a:hover { background:#eef2ff; color:#1d4ed8; }
    .profile-switcher { display:flex; gap:.45rem; align-items:center; color:#334155; padding:0; border:0; box-shadow:none; background:transparent; }
    .profile-switcher label { display:flex; gap:.4rem; align-items:center; font-weight:500; }
    .profile-switcher select { width:12rem; padding:.38rem .55rem; border-radius:999px; border:1px solid #cbd5e1; background:white; color:var(--text); }
    main { width:min(1160px, calc(100% - 2rem)); margin:1rem auto 2.5rem; }
    .hero, .card, form, table { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
    .hero { padding:1rem; margin-bottom:.8rem; }
    .card { padding:.9rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(235px, 1fr)); gap:.8rem; }
    .two-column { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:.75rem; }
    form { padding:.85rem; display:grid; gap:.7rem; }
    label { font-weight:500; display:grid; gap:.3rem; }
    input, textarea, select { width:100%; padding:.55rem .65rem; border:1px solid #cbd5e1; border-radius:10px; font:inherit; background:white; }
    textarea { min-height:110px; resize:vertical; }
    button, .button { display:inline-block; width:max-content; border:0; border-radius:999px; background:var(--brand); color:white; padding:.5rem .8rem; font-weight:700; text-decoration:none; cursor:pointer; }
    button:hover, .button:hover { background:var(--brand-dark); color:white; }
    .compact { padding:.38rem .62rem; font-size:.92rem; }
    .icon-button { display:inline-grid; place-items:center; width:2rem; height:2rem; padding:0; border-radius:999px; }
    .secondary, .button.secondary { background:#475569; color:white; } .danger, .button.danger { background:var(--bad); } .ghost { background:#e2e8f0; color:#172033; }
    table { width:100%; border-collapse:collapse; overflow:hidden; }
    th, td { padding:.6rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    .badge { border-radius:999px; padding:.18rem .5rem; font-size:.8rem; font-weight:750; background:#e0e7ff; color:#3730a3; display:inline-block; }
    .badge.good { background:#dcfce7; color:var(--good); } .badge.warn { background:#fef3c7; color:var(--warn); } .badge.bad { background:#fee2e2; color:var(--bad); }
    .muted { color:var(--muted); } .actions, .toolbar, .section-header-row { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; }
    .section-header-row { justify-content:space-between; }
    .empty, .empty-state { padding:1.25rem; text-align:center; border:1px dashed #cbd5e1; border-radius:14px; background:#fff; }
    .tabs { display:flex; gap:.4rem; margin:.6rem 0; } .tab { padding:.42rem .65rem; border-radius:999px; background:#e2e8f0; font-weight:700; }
    .tab.active { background:#dbeafe; color:#1d4ed8; }
    .compare { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:.8rem; }
    .before,.after { padding:.8rem; border-radius:12px; background:#f8fafc; border:1px solid var(--line); white-space:pre-wrap; }
    .chart { display:flex; gap:.25rem; align-items:end; height:88px; padding:.65rem; border:1px solid var(--line); border-radius:12px; background:#f8fafc; }
    .bar { flex:1; min-width:4px; background:#93c5fd; border-radius:999px 999px 0 0; }
    .section-card { border:1px solid var(--line); border-radius:14px; padding:.85rem; background:#fff; margin:.8rem 0; }
    .block-card { border:1px solid #dbeafe; border-radius:12px; padding:.8rem; background:#f8fbff; margin:.65rem 0; }
    @media (max-width:720px) { .shell-header { align-items:flex-start; } nav { width:100%; overflow-x:auto; } .profile-switcher { width:100%; } }
  </style>
</head>
<body>
  <header class="shell-header">
    <div class="brand"><span class="brand-icon">✦</span><span>AI JOB APPLICATION ASSISTANT by Alex Tymoshenko<small><a href="https://github.com/alextymoshenko">GitHub profile</a></small></span></div>
    <nav aria-label="Main navigation">
      <a href="/">⌂ Dashboard</a>
      <a href="/applications">◩ Application</a>
      <a href="/settings">⚙ Settings</a>
    </nav>
    <form class="profile-switcher" action="/settings/active-profile" method="post">
      <input type="hidden" name="next" value="{{ request.url.path }}">
      {% if shell.profiles %}
        <label>Active profile
          <select name="active_profile_id" onchange="this.form.submit()">
            <option value="">No active profile</option>
            {% for profile in shell.profiles %}
              <option value="{{ profile.id }}" {% if shell.active_profile and shell.active_profile.id == profile.id %}selected{% endif %}>{{ profile.display_name }}</option>
            {% endfor %}
          </select>
        </label>
      {% else %}
        <span>Active profile: No active profile</span>
      {% endif %}
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    document.querySelectorAll('[data-copy-target]').forEach((button) => {
      button.addEventListener('click', async () => {
        const target = document.querySelector(button.dataset.copyTarget);
        if (!target) return;
        await navigator.clipboard.writeText(target.value || target.textContent || '');
        const form = button.closest('form[data-copy-form]');
        if (form) form.submit();
      });
    });
  </script>
</body>
</html>
