<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "AI JOB APPLICATION ASSISTANT by Alex Tymoshenko" }}</title>
  <style>
    :root { --bg:#f6f8fb; --panel:#fff; --text:#172033; --muted:#64748b; --brand:#2563eb; --brand-dark:#1d4ed8; --line:#e2e8f0; --good:#15803d; --warn:#b45309; --bad:#b91c1c; --shadow:0 8px 22px rgba(15,23,42,.06); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
    a { color:var(--brand); }
    h1, h2, h3 { margin:.2rem 0 .55rem; line-height:1.2; }
    .shell-header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; justify-content:space-between; padding:.65rem 1rem; background:#ffffff; color:var(--text); border-bottom:1px solid var(--line); box-shadow:0 4px 16px rgba(15,23,42,.05); }
    .brand { display:flex; align-items:center; gap:.55rem; font-weight:800; letter-spacing:.01em; }
    .brand small { display:block; font-weight:400; letter-spacing:0; color:var(--muted); }
    .brand small a { color:var(--muted); text-decoration:none; }
    .brand-icon { display:grid; place-items:center; width:2rem; height:2rem; border-radius:.65rem; background:#dbeafe; color:#1d4ed8; }
    nav { display:flex; gap:.35rem; align-items:center; }
    nav a { color:#334155; text-decoration:none; font-weight:600; padding:.42rem .65rem; border-radius:999px; }
    nav a:hover { background:#eef2ff; color:#1d4ed8; }
    .header-tools { display:flex; gap:.5rem; align-items:center; margin-left:auto; }
    .profile-switcher { display:flex; gap:.45rem; align-items:center; color:#334155; padding:0; border:0; box-shadow:none; background:transparent; }
    .profile-switcher label { font-weight:600; display:flex; gap:.45rem; align-items:center; }
    .profile-switcher select { width:13rem; padding:.4rem .55rem; border-radius:999px; border:1px solid #cbd5e1; background:white; color:#172033; }
    main { width:min(1180px, calc(100% - 1.5rem)); margin:1rem auto 2.5rem; }
    .hero, .card, form, table { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
    .hero { padding:1rem; margin-bottom:.85rem; }
    .card { padding:.9rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:.8rem; }
    .settings-grid { display:grid; grid-template-columns:repeat(3, minmax(220px, 1fr)); gap:.8rem; align-items:start; }
    .two-column { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:.75rem; }
    form { padding:.85rem; display:grid; gap:.65rem; }
    form.card, .card form, .profile-switcher { box-shadow:none; }
    label { font-weight:400; display:grid; gap:.3rem; }
    input, textarea, select { width:100%; padding:.55rem .65rem; border:1px solid #cbd5e1; border-radius:10px; font:inherit; background:white; }
    textarea { min-height:110px; resize:vertical; }
    .job-description { min-height:220px; max-width:100%; resize:vertical; }
    button, .button { display:inline-block; width:max-content; border:0; border-radius:999px; background:var(--brand); color:white; padding:.5rem .8rem; font-weight:700; text-decoration:none; cursor:pointer; font-size:.92rem; }
    button:hover, .button:hover { background:var(--brand-dark); color:white; }
    .compact, .compact-button { padding:.38rem .65rem; font-size:.88rem; }
    .secondary, .secondary-button { background:#475569; } .danger, .danger-button { background:var(--bad); } .ghost { background:#e2e8f0; color:#172033; }
    .icon-button { width:2rem; height:2rem; padding:0; display:inline-grid; place-items:center; border-radius:999px; }
    table { width:100%; border-collapse:collapse; overflow:hidden; }
    th, td { padding:.6rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    .badge { border-radius:999px; padding:.18rem .5rem; font-size:.78rem; font-weight:700; background:#e0e7ff; color:#3730a3; display:inline-block; }
    .badge.good { background:#dcfce7; color:var(--good); } .badge.warn { background:#fef3c7; color:var(--warn); } .badge.bad { background:#fee2e2; color:var(--bad); }
    .muted { color:var(--muted); } .actions, .toolbar { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; }
    .empty, .empty-state { padding:1.25rem; text-align:center; border:1px dashed #cbd5e1; border-radius:14px; background:#fff; }
    .tabs { display:flex; gap:.4rem; margin:.65rem 0; } .tab { padding:.42rem .65rem; border-radius:999px; background:#e2e8f0; font-weight:700; }
    .tab.active { background:#dbeafe; color:#1d4ed8; }
    .compare { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:.8rem; }
    .before,.after { padding:.8rem; border-radius:12px; background:#f8fafc; border:1px solid var(--line); white-space:pre-wrap; }
    .chart { display:flex; gap:.3rem; align-items:end; height:130px; padding:.85rem; border:1px solid var(--line); border-radius:14px; background:linear-gradient(180deg,#f8fbff,#eef6ff); }
    .bar { flex:1; min-width:6px; background:linear-gradient(180deg,#2563eb,#93c5fd); border-radius:8px 8px 2px 2px; box-shadow:0 4px 10px rgba(37,99,235,.18); }
    .range-tabs { display:flex; gap:.4rem; flex-wrap:wrap; margin:.5rem 0 .8rem; }
    .settings-layout, .cv-layout, .resume-management-layout { display:grid; grid-template-columns:minmax(210px, 280px) 1fr; gap:.9rem; align-items:start; }
    .side-menu { display:grid; gap:.35rem; }
    .side-menu a { text-decoration:none; padding:.55rem .65rem; border-radius:10px; color:#334155; font-weight:700; }
    .side-menu a.active, .side-menu a:hover { background:#dbeafe; color:#1d4ed8; }
    .section-card { border:1px solid var(--line); border-radius:14px; padding:.85rem; background:#fff; margin:.85rem 0; }
    .block-card { border:1px solid #dbeafe; border-radius:12px; padding:.8rem; background:#f8fbff; margin:.65rem 0; }
    .section-header-row { display:flex; flex-wrap:wrap; justify-content:space-between; gap:.5rem; align-items:center; }
    @media (max-width:720px) { .shell-header { align-items:flex-start; } nav, .header-tools { width:100%; overflow-x:auto; } .profile-switcher { width:100%; } .settings-layout, .cv-layout, .resume-management-layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="shell-header">
    <div class="brand"><span class="brand-icon">✦</span><span>AI JOB APPLICATION ASSISTANT by Alex Tymoshenko<small><a href="https://github.com/AlexTymosh/job-application-assistant">Project on GitHub</a></small></span></div>
    <nav aria-label="Main navigation">
      <a href="/">🏠 Dashboard</a>
      <a href="/applications">📄 Application</a>
      <a href="/cv-builder">🧩 CV Builder</a>
    </nav>
    <div class="header-tools" aria-label="Header tools">
      <a class="button compact secondary" href="/settings">⚙ Settings</a>
    <form class="profile-switcher" action="/settings/active-profile" method="post">
      <input type="hidden" name="next" value="{{ request.url.path }}">
      <label>Active profile
      {% if shell.profiles %}
        <select name="active_profile_id" onchange="this.form.submit()">
          {% for profile in shell.profiles %}
            <option value="{{ profile.id }}" {% if shell.active_profile and shell.active_profile.id == profile.id %}selected{% endif %}>{{ profile.display_name }}</option>
          {% endfor %}
        </select>
      {% else %}
        <span>No profile</span>
      {% endif %}
      </label>
    </form>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll('[data-copy-target]').forEach((button) => {
      button.addEventListener('click', async () => {
        const target = document.querySelector(button.dataset.copyTarget);
        if (!target) return;
        await navigator.clipboard.writeText(target.value || target.textContent || '');
        const form = button.closest('[data-copy-form]');
        if (form) form.submit();
      });
    });
  </script>
</body>
</html>
