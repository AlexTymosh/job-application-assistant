<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "AI JOB APPLICATION ASSISTANT by Alex Tymoshenko" }}</title>
  <style>
    :root { --bg:#f6f8fb; --panel:#fff; --text:#172033; --muted:#64748b; --brand:#2563eb; --brand-dark:#1d4ed8; --line:#e2e8f0; --good:#15803d; --warn:#b45309; --bad:#b91c1c; --shadow:0 8px 22px rgba(15,23,42,.06); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
    a { color:var(--brand); }
    h1, h2, h3 { margin:.2rem 0 .55rem; line-height:1.2; }
    .shell-header { position:sticky; top:0; z-index:5; display:grid; grid-template-columns:auto 1fr auto; gap:.75rem; align-items:center; padding:.55rem .9rem; background:#ffffff; color:var(--text); border-bottom:1px solid var(--line); box-shadow:0 4px 16px rgba(15,23,42,.05); }
    .brand { display:flex; align-items:center; gap:.5rem; font-weight:800; letter-spacing:.01em; min-width:260px; }
    .brand small { display:block; font-weight:500; letter-spacing:0; color:var(--muted); font-size:.78rem; }
    .brand small a { color:var(--muted); text-decoration:none; }
    .brand-icon { display:grid; place-items:center; width:1.85rem; height:1.85rem; border-radius:.6rem; background:#dbeafe; color:#1d4ed8; }
    .header-tools { display:flex; justify-content:flex-end; gap:.45rem; align-items:center; }
    nav { display:flex; gap:.25rem; align-items:center; justify-content:center; }
    nav a, .header-tools > a { color:#334155; text-decoration:none; font-weight:700; padding:.36rem .58rem; border-radius:999px; font-size:.9rem; }
    nav a:hover, .header-tools > a:hover { background:#eef2ff; color:#1d4ed8; }
    .profile-switcher { display:flex; gap:.4rem; align-items:center; color:#334155; padding:0; border:0; box-shadow:none; background:transparent; }
    .profile-switcher label { font-weight:700; display:flex; gap:.4rem; align-items:center; white-space:nowrap; }
    .profile-switcher select { width:12rem; padding:.36rem .5rem; border-radius:999px; border:1px solid #cbd5e1; background:white; color:#172033; }
    main { width:min(1180px, calc(100% - 1.5rem)); margin:1rem auto 2.5rem; }
    .hero, .card, form, table { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
    .hero { padding:1rem; margin-bottom:.85rem; } .card { padding:.9rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:.8rem; }
    .two-column { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:.75rem; }
    .workspace-layout, .settings-layout { display:grid; grid-template-columns:260px 1fr; gap:1rem; align-items:start; }
    .sidebar { background:#fff; border:1px solid var(--line); border-radius:14px; padding:.75rem; box-shadow:var(--shadow); }
    .side-menu { display:grid; gap:.35rem; } .side-menu a { text-decoration:none; border-radius:10px; padding:.5rem .6rem; color:#334155; font-weight:700; } .side-menu a.active, .side-menu a:hover { background:#dbeafe; color:#1d4ed8; }
    form { padding:.85rem; display:grid; gap:.65rem; } form.card, .card form, .profile-switcher, .inline-form { box-shadow:none; }
    label { font-weight:400; display:grid; gap:.3rem; }
    input, textarea, select { width:100%; padding:.55rem .65rem; border:1px solid #cbd5e1; border-radius:10px; font:inherit; background:white; }
    textarea { min-height:110px; resize:vertical; } .job-description { min-height:220px; max-width:100%; resize:vertical; }
    button, .button { display:inline-block; width:max-content; border:0; border-radius:999px; background:var(--brand); color:white; padding:.5rem .8rem; font-weight:700; text-decoration:none; cursor:pointer; font-size:.92rem; }
    button:hover, .button:hover { background:var(--brand-dark); color:white; }
    .compact, .compact-button { padding:.35rem .6rem; font-size:.86rem; } .secondary, .secondary-button { background:#475569; } .danger, .danger-button { background:var(--bad); } .ghost { background:#e2e8f0; color:#172033; }
    .icon-button { width:1.65rem; height:1.65rem; padding:0; display:inline-grid; place-items:center; border-radius:999px; font-size:.82rem; }
    table { width:100%; border-collapse:collapse; overflow:hidden; } th, td { padding:.6rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    .badge { border-radius:999px; padding:.18rem .5rem; font-size:.78rem; font-weight:700; background:#e0e7ff; color:#3730a3; display:inline-block; }
    .badge.good { background:#dcfce7; color:var(--good); } .badge.warn { background:#fef3c7; color:var(--warn); } .badge.bad { background:#fee2e2; color:var(--bad); }
    .muted { color:var(--muted); } .actions, .toolbar { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; }
    .empty, .empty-state { padding:1.25rem; text-align:center; border:1px dashed #cbd5e1; border-radius:14px; background:#fff; }
    .tabs { display:flex; gap:.4rem; margin:.65rem 0; } .tab { padding:.42rem .65rem; border-radius:999px; background:#e2e8f0; font-weight:700; text-decoration:none; } .tab.active { background:#dbeafe; color:#1d4ed8; }
    .compare { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:.8rem; } .before,.after { padding:.8rem; border-radius:12px; background:#f8fafc; border:1px solid var(--line); white-space:pre-wrap; }
    .chart-frame { display:grid; grid-template-columns:2.2rem 1fr; gap:.45rem; align-items:stretch; }
    .chart-area { display:grid; gap:.25rem; }
    .chart { display:flex; gap:.28rem; align-items:end; height:128px; padding:.9rem; border:1px solid var(--line); border-radius:14px; background:linear-gradient(180deg,#f8fafc,#eef6ff); }
    .bar { flex:1; min-width:5px; background:linear-gradient(180deg,#93c5fd,#1d4ed8); border-radius:999px 999px 4px 4px; outline:1px solid rgba(37,99,235,.08); }
    .bar.empty-bar { background:#dbeafe; opacity:.55; }
    .x-axis { display:flex; gap:.28rem; font-size:.72rem; color:var(--muted); }
    .x-axis span { flex:1; min-width:5px; text-align:center; }
    .y-axis { display:flex; flex-direction:column; justify-content:space-between; height:128px; padding:.9rem 0; font-size:.72rem; color:var(--muted); text-align:right; }
    .section-card { border:1px solid var(--line); border-radius:12px; padding:.65rem; background:#fff; margin:.55rem 0; box-shadow:0 3px 10px rgba(15,23,42,.035); }
    .block-card { border:1px solid #e5e7eb; border-radius:10px; padding:.55rem .65rem; background:#fbfdff; margin:.4rem 0; }
    .section-header-row { display:flex; flex-wrap:wrap; justify-content:space-between; gap:.5rem; align-items:center; }
    @media (max-width:820px) { .shell-header { grid-template-columns:1fr; } nav { justify-content:flex-start; overflow-x:auto; } .header-tools { justify-content:flex-start; flex-wrap:wrap; } .workspace-layout, .settings-layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="shell-header">
    <div class="brand"><span class="brand-icon">✦</span><span>AI JOB APPLICATION ASSISTANT by Alex Tymoshenko<small><a href="https://github.com/AlexTymosh/job-application-assistant">Project on GitHub</a></small></span></div>
    <nav aria-label="Main navigation">
      <a href="/">🏠 Dashboard</a>
      <a href="/applications">📄 Application</a>
      <a href="/cv-builder">🧩 CV Builder</a>
    </nav>
    <div class="header-tools" aria-label="Header tools">
      <a href="/settings">⚙ Settings</a>
      <form class="profile-switcher" action="/settings/active-profile" method="post">
        <input type="hidden" name="next" value="{{ request.url.path }}">
        <label aria-label="Active profile">
        {% if shell.profiles %}
          <select name="active_profile_id" aria-label="Active profile" onchange="this.form.submit()">
            <option value="">No profile</option>
            {% for profile in shell.profiles %}
              <option value="{{ profile.id }}" {% if shell.active_profile and shell.active_profile.id == profile.id %}selected{% endif %}>{{ profile.display_name }}</option>
            {% endfor %}
          </select>
        {% else %}
          <span aria-label="Active profile">No profile</span>
        {% endif %}
        </label>
      </form>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    document.querySelectorAll('[data-copy-target]').forEach((button) => {
      button.addEventListener('click', async () => {
        const target = document.querySelector(button.dataset.copyTarget);
        if (!target) return;
        await navigator.clipboard.writeText(target.value || target.textContent || '');
        const form = button.closest('[data-copy-form]');
        if (form) form.submit();
      });
    });
  </script>
</body>
</html>
