<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Resume Builder" }}</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --panel:#fff; --text:#1f2937; --muted:#6b7280; --brand:#2563eb; --line:#e5e7eb; --good:#15803d; --warn:#b45309; --bad:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { background:#111827; color:#fff; padding:1rem 1.5rem; }
    nav { display:flex; flex-wrap:wrap; gap:.75rem; margin-top:.75rem; }
    nav a { color:#dbeafe; text-decoration:none; font-weight:600; }
    main { width:min(1180px, calc(100% - 2rem)); margin:1.5rem auto 3rem; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:1rem; }
    .card, form, table { background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(15,23,42,.05); }
    .card { padding:1rem; }
    form { padding:1rem; display:grid; gap:.85rem; }
    label { font-weight:700; display:grid; gap:.35rem; }
    input, textarea, select { width:100%; padding:.7rem; border:1px solid #cbd5e1; border-radius:10px; font:inherit; }
    textarea { min-height:130px; }
    button, .button { display:inline-block; width:max-content; border:0; border-radius:999px; background:var(--brand); color:white; padding:.65rem 1rem; font-weight:700; text-decoration:none; cursor:pointer; }
    .secondary { background:#475569; }
    .danger { background:var(--bad); }
    table { width:100%; border-collapse:collapse; overflow:hidden; }
    th, td { padding:.75rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    .badge { border-radius:999px; padding:.2rem .55rem; font-size:.85rem; font-weight:700; background:#e0e7ff; color:#3730a3; }
    .badge.good { background:#dcfce7; color:var(--good); } .badge.warn { background:#fef3c7; color:var(--warn); } .badge.bad { background:#fee2e2; color:var(--bad); }
    .muted { color:var(--muted); } .actions { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .compare { display:grid; grid-template-columns:1fr 1fr; gap:1rem; } .before,.after { padding:1rem; border-radius:12px; background:#f8fafc; border:1px solid var(--line); }
    @media (max-width:760px){ .compare { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <strong>Local Resume Builder + AI Tailoring</strong>
    <nav>
      <a href="/">Dashboard</a><a href="/setup">Setup</a><a href="/settings">Settings</a><a href="/data-folder">Data Folder</a><a href="/profiles">Profiles</a><a href="/applications">Applications</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
