{% extends "base.html" %}{% block content %}<div class="actions"><h1>Applications</h1><a class="button" href="/applications/new">New application</a></div><table><thead><tr><th>No.</th><th>Role</th><th>Company</th><th>Status</th><th></th></tr></thead><tbody>{% for app in applications %}<tr><td>APP-{{ '%06d'|format(app.application_number) }}</td><td>{{ app.job_title }}</td><td>{{ app.company_name }}</td><td><span class="badge">{{ app.status }}</span></td><td><a class="button" href="/applications/{{ app.id }}">Open</a></td></tr>{% endfor %}</tbody></table>{% endblock %}
