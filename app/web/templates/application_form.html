{% extends "base.html" %}{% block content %}<h1>New application</h1><form method="post"><label>Profile<select name="profile_id">{% for profile in profiles %}<option value="{{ profile.id }}">{{ profile.display_name }}</option>{% endfor %}</select></label><label>Resume<select name="resume_id">{% for resume in resumes %}<option value="{{ resume.id }}">{{ resume.profile.display_name if resume.profile else '' }} — {{ resume.name }}</option>{% endfor %}</select></label><label>Job title<input name="job_title"></label><label>Company<input name="company_name"></label><label>Source URL<input name="source_url"></label><label>Job description<textarea name="raw_job_text" required></textarea></label><button>Save application</button></form>{% endblock %}
