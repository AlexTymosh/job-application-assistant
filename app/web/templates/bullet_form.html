{% extends "base.html" %}{% block content %}<h1>{{ 'Edit bullet' if bullet else 'Add bullet' }}</h1><form method="post"><label>Bullet text<textarea name="text" required>{{ bullet.text if bullet else '' }}</textarea></label><label><input type="checkbox" name="ai_edit_enabled" value="true" {% if bullet and bullet.ai_edit_enabled %}checked{% endif %}> AI may rewrite this bullet</label><label><input type="checkbox" name="fact_link_required" value="true" {% if not bullet or bullet.fact_link_required %}checked{% endif %}> Require verified fact support</label><button>Save bullet</button></form>{% endblock %}
