{% extends "base.html" %}
{% block content %}
<section class="card"><h1>{% if profile %}Edit Profile{% else %}New Profile{% endif %}</h1><form method="post"><label>Display name<input name="display_name" value="{{ profile.display_name if profile else '' }}" required></label><label>Full name<input name="full_name" value="{{ profile.full_name if profile else '' }}"></label><label>Preferred name<input name="preferred_name" value="{{ profile.preferred_name if profile else '' }}"></label>{% if profile %}{% set contact = profile.contact %}<label>Location<input name="location" value="{{ contact.location if contact else profile.location }}"></label><div class="form-grid"><label>Email<input name="email" value="{{ contact.email if contact else '' }}"></label><label>Phone<input name="phone" value="{{ contact.phone if contact else '' }}"></label></div><label>LinkedIn URL<input name="linkedin_url" value="{{ contact.linkedin_url if contact else '' }}"></label><label>GitHub URL<input name="github_url" value="{{ contact.github_url if contact else '' }}"></label><label>Extra text<input name="extra_text" value="{{ contact.extra_text if contact else '' }}"></label>{% endif %}<button type="submit">Save profile</button></form></section>
{% endblock %}
