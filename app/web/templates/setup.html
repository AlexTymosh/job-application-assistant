{% extends "base.html" %}{% block content %}<h1>Setup diagnostics</h1><table><thead><tr><th>Status</th><th>Check</th><th>Message</th><th>Action</th></tr></thead><tbody>{% for check in setup_status.checks %}<tr><td><span class="badge {{ 'good' if check.ok else 'bad' }}">{{ 'Pass' if check.ok else 'Fail' }}</span></td><td>{{ check.label }}</td><td>{{ check.message }}</td><td>{{ check.action_hint }}</td></tr>{% endfor %}</tbody></table>{% endblock %}
