{% extends "base.html" %}{% block content %}<h1>Exports</h1>{% if snapshot_id %}<form method="post"><input type="hidden" name="snapshot_id" value="{{ snapshot_id }}"><button>Create enabled artifacts</button></form>{% endif %}<section class="card"><h2>Available downloads</h2><ul>{% for artifact in artifacts %}<li>{{ artifact.artifact_type }} — <a href="/applications/{{ application.id }}/download/{{ artifact.id }}">Download</a></li>{% else %}<li>No artifacts yet.</li>{% endfor %}</ul></section>{% endblock %}
