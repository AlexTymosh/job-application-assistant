{% extends "base.html" %}
{% block content %}
<section class="hero-card"><h1>Resume Variants</h1><a class="button" href="/profiles/{{ profile_id }}/resumes/new">New Resume Variant</a></section>
<section class="card">{% if resumes %}<table>{% for resume in resumes %}<tr><td>{{ resume.name }}</td><td>{{ resume.target_role }}</td><td><a class="button compact" href="/resumes/{{ resume.id }}/builder">Edit</a></td></tr>{% endfor %}</table>{% else %}<p class="empty">No resume variants yet.</p>{% endif %}</section>
{% endblock %}
