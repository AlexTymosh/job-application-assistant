{% extends "base.html" %}{% block content %}<div class="actions"><h1>Facts</h1><a class="button" href="/profiles/{{ profile_id }}/facts/new">Add fact</a></div><table><thead><tr><th>Key</th><th>Claim</th><th>Level</th><th>Evidence</th></tr></thead><tbody>{% for fact in facts %}<tr><td>{{ fact.fact_key }}</td><td>{{ fact.claim }}</td><td><span class="badge">{{ fact.allowed_claim_level }}</span></td><td>{{ fact.evidence }}</td></tr>{% endfor %}</tbody></table>{% endblock %}
