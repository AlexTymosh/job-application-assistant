version: "3"

tasks:
  install:
    desc: Install project and development dependencies
    cmds:
      - uv sync --group dev

  lock:
    desc: Generate or update uv.lock
    cmds:
      - uv lock

  format:
    desc: Format and auto-fix Python files
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  lint:
    desc: Run lint checks
    cmds:
      - uv run ruff check .

  format-check:
    desc: Check formatting without modifying files
    cmds:
      - uv run ruff format --check .

  test:
    desc: Run tests
    cmds:
      - uv run pytest

  pre-commit:
    desc: Run pre-commit on all files
    cmds:
      - uv run pre-commit run --all-files

  check:
    desc: Run all local verification checks
    cmds:
      - task: format-check
      - task: lint
      - task: test

  db-upgrade:
    desc: Apply Alembic migrations to the active profile database
    cmds:
      - uv run alembic upgrade head

  db-current:
    desc: Show current Alembic revision for the active profile database
    cmds:
      - uv run alembic current

  db-history:
    desc: Show Alembic migration history
    cmds:
      - uv run alembic history

  db-revision:
    desc: Create a new Alembic revision
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"